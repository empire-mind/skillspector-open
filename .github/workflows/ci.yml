name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - name: sample scan must fire HIGH (exit 1 by design)
        run: |
          if python slop-scan.py examples/sample-project; then
            echo "sample project should produce HIGH findings" && exit 1
          fi
